openapi: 3.0.3
info:
  title: CodeGenie API
  version: 1.0.0
  description: HTTP API for the CodeGenie web app.
servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Health
  - name: Example
  - name: GitHub
  - name: Projects
  - name: Tasks
  - name: Runs

paths:
  /health:
    get:
      tags: [Health]
      summary: Process health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessHealth"

  /api/example/health:
    get:
      tags: [Example]
      summary: Example resource health check
      operationId: getExampleHealth
      security: []
      responses:
        "200":
          description: Example resource is up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [health]
                        properties:
                          health:
                            $ref: "#/components/schemas/ExampleHealth"

  /api/example/items:
    get:
      tags: [Example]
      summary: List example items for the signed-in user
      operationId: listExampleItems
      responses:
        "200":
          description: Items for the current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ExampleItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Example]
      summary: Create an example item
      operationId: createExampleItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExampleItem"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: "#/components/schemas/ExampleItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/example/items/{itemId}:
    get:
      tags: [Example]
      summary: Get one example item
      operationId: getExampleItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: "#/components/schemas/ExampleItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/github/installations:
    get:
      tags: [GitHub]
      summary: GitHub App installations the signed-in user can access
      description: Through the user's own GitHub token. `installUrl` installs the App or changes which repositories it can access.
      operationId: listGitHubInstallations
      responses:
        "200":
          description: Installations and the install link
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [installations, installUrl]
                        properties:
                          installations:
                            type: array
                            items:
                              $ref: "#/components/schemas/GitHubInstallation"
                          installUrl:
                            type: string
                            format: uri
                            example: https://github.com/apps/codegenie-dev-app/installations/new
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"

  /api/github/installations/{installationId}/repositories:
    get:
      tags: [GitHub]
      summary: Repositories of one installation that the signed-in user can access
      description: Most recently updated first.
      operationId: listGitHubInstallationRepositories
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [repositories]
                        properties:
                          repositories:
                            type: array
                            items:
                              $ref: "#/components/schemas/GitHubRepo"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"
        "404":
          description: The user can't access this installation (`GITHUB_INSTALLATION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects:
    get:
      tags: [Projects]
      summary: The signed-in user's projects
      description: Newest first.
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [projects]
                        properties:
                          projects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Add a repository as a project
      description: The installation must be recorded, installed and not suspended, and the repository visible through the user's own GitHub token. Adding a repository that's already a project returns that project.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "200":
          description: Already a project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"
        "404":
          description: The installation isn't recorded, was uninstalled or isn't visible to the user (`GITHUB_INSTALLATION_NOT_FOUND`), or the repository isn't visible (`GITHUB_REPOSITORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The App is suspended on that account (`GITHUB_INSTALLATION_SUSPENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      summary: One of the signed-in user's projects
      operationId: getProject
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
    delete:
      tags: [Projects]
      summary: Remove a project
      description: Deletes its tasks, runs and environments from CodeGenie. The repository and its pull requests on GitHub are not touched.
      operationId: deleteProject
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: string
                            format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: A run is queued or running (`PROJECT_BUSY`); cancel it first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}/onboarding:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Projects]
      summary: Set up the project's environment
      description: Queues environment setup. While one is queued or running for the project, another isn't added.
      operationId: startProjectOnboarding
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [projectId]
                        properties:
                          projectId:
                            type: string
                            format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: The App is uninstalled (`GITHUB_INSTALLATION_REMOVED`) or suspended (`GITHUB_INSTALLATION_SUSPENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/QueueUnavailable"

  /api/projects/{projectId}/tasks:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Start a task on a project
      description: Creates the task, its first message and a queued run, and queues the run. The title is the prompt's first line; the base branch defaults to the project's.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Created and queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [task, run]
                        properties:
                          task:
                            type: object
                            required: [id, projectId, title, baseBranch, createdAt]
                            properties:
                              id:
                                type: string
                                format: uuid
                              projectId:
                                type: string
                                format: uuid
                              title:
                                type: string
                              baseBranch:
                                type: string
                              createdAt:
                                type: string
                                format: date-time
                          run:
                            type: object
                            required: [id, status, model]
                            properties:
                              id:
                                type: string
                                format: uuid
                              status:
                                type: string
                                enum: [queued]
                              model:
                                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: The project isn't set up (`PROJECT_NOT_SET_UP`), needs attention (`PROJECT_NEEDS_ATTENTION`), or its App is uninstalled (`GITHUB_INSTALLATION_REMOVED`) or suspended (`GITHUB_INSTALLATION_SUSPENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/QueueUnavailable"

  /api/tasks:
    get:
      tags: [Tasks]
      summary: The signed-in user's tasks
      description: Newest first, 50 per page.
      operationId: listTasks
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: "`nextCursor` from the previous page"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tasks, nextCursor]
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: "#/components/schemas/TaskListItem"
                          nextCursor:
                            type: string
                            format: uuid
                            nullable: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: A task with its messages and runs
      operationId: getTask
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [task]
                        properties:
                          task:
                            $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not one of the user's tasks (`TASK_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Runs]
      summary: One run
      operationId: getRun
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [run]
                        properties:
                          run:
                            $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"

  /api/runs/{runId}/diff:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Runs]
      summary: The run's changes as a patch
      operationId: getRunDiff
      responses:
        "200":
          description: The diff, or null when the run changed nothing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [diff]
                        properties:
                          diff:
                            nullable: true
                            allOf:
                              - $ref: "#/components/schemas/RunDiff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"

  /api/runs/{runId}/cancel:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Runs]
      summary: Cancel a run
      description: A queued run is cancelled at once; a running one is told to stop and ends cancelled shortly after.
      operationId: cancelRun
      responses:
        "202":
          description: Cancelled, or stopping
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [outcome]
                        properties:
                          outcome:
                            type: string
                            enum: [cancelled, stopping]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "409":
          description: The run has already ended (`RUN_ENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie set by signing in.

  responses:
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubSignInRequired:
      description: Not signed in, or no usable GitHub token (`GITHUB_SIGN_IN_REQUIRED`); sign in with GitHub again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProjectNotFound:
      description: Not one of the user's projects, or it doesn't exist (`PROJECT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RunNotFound:
      description: Not a run on one of the user's tasks (`RUN_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    QueueUnavailable:
      description: Work couldn't be queued (`QUEUE_UNAVAILABLE`); try again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    SuccessEnvelope:
      type: object
      required: [status, message, type, data]
      properties:
        status:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [success]
        data:
          type: object

    ErrorEnvelope:
      type: object
      required: [status, message, type]
      properties:
        status:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [error]
        code:
          type: string
        data:
          type: object

    ProcessHealth:
      type: object
      required: [status, timestamp, environment]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        environment:
          type: string
          example: development

    ExampleHealth:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [up]
        timestamp:
          type: string
          format: date-time

    ExampleItem:
      type: object
      required: [id, userId, name, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateExampleItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    GitHubInstallation:
      type: object
      required: [id, accountLogin, accountType]
      properties:
        id:
          type: integer
          example: 173633971
        accountLogin:
          type: string
          example: acme
        accountType:
          type: string
          enum: [user, organization]
    GitHubRepo:
      type: object
      required: [id, fullName, owner, name, defaultBranch, private, htmlUrl, updatedAt, projectId]
      properties:
        id:
          type: integer
          description: GitHub's repository id
        fullName:
          type: string
          example: octocat/Hello-World
        owner:
          type: string
        name:
          type: string
        defaultBranch:
          type: string
          example: main
        private:
          type: boolean
        htmlUrl:
          type: string
          format: uri
        updatedAt:
          type: string
          format: date-time
          nullable: true
        projectId:
          type: string
          format: uuid
          nullable: true
          description: The user's project for this repository, if it's one already
    Project:
      type: object
      required: [id, repo, defaultBranch, environment, installation, createdAt]
      properties:
        id:
          type: string
          format: uuid
        repo:
          type: object
          required: [githubId, owner, name]
          properties:
            githubId:
              type: integer
            owner:
              type: string
              example: acme
            name:
              type: string
              example: web
        defaultBranch:
          type: string
          example: main
        environment:
          type: object
          nullable: true
          description: The active environment; null until the project is set up
          required: [version, health, healthReasons, savedAt]
          properties:
            version:
              type: integer
            health:
              type: string
              enum: [ok, needs_attention]
            healthReasons:
              type: array
              items:
                type: string
            savedAt:
              type: string
              format: date-time
        installation:
          type: object
          required: [accountLogin, suspended, uninstalled]
          properties:
            accountLogin:
              type: string
            suspended:
              type: boolean
            uninstalled:
              type: boolean
        createdAt:
          type: string
          format: date-time
    CreateProject:
      type: object
      required: [installationId, repoId]
      properties:
        installationId:
          type: integer
          description: GitHub's installation id
        repoId:
          type: integer
          description: GitHub's repository id

    CreateTask:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
          example: Add a GET /health endpoint that returns 503 when the database is down.
        baseBranch:
          type: string
          example: main
    TaskLabel:
      type: string
      enum: [queued, working, pr_open, pr_draft, merged, closed, no_changes, failed, cancelled]
    RunError:
      type: object
      nullable: true
      required: [code, message]
      properties:
        code:
          type: string
          example: deliver_failed
        message:
          type: string
          nullable: true
    TaskListItem:
      type: object
      required: [id, title, project, label, baseBranch, branchName, pullRequest, latestRun, runCount, durationMs, costUsd, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        project:
          type: object
          required: [id, owner, name]
          properties:
            id:
              type: string
              format: uuid
            owner:
              type: string
            name:
              type: string
        label:
          $ref: "#/components/schemas/TaskLabel"
        baseBranch:
          type: string
        branchName:
          type: string
          nullable: true
        pullRequest:
          type: object
          nullable: true
          required: [number, url, draft]
          properties:
            number:
              type: integer
            url:
              type: string
              format: uri
            draft:
              type: boolean
        latestRun:
          type: object
          nullable: true
          required: [id, status, stage, error]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/RunStatus"
            stage:
              $ref: "#/components/schemas/RunStage"
            error:
              $ref: "#/components/schemas/RunError"
        runCount:
          type: integer
        durationMs:
          type: integer
        costUsd:
          type: number
          example: 0.21
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskListItem"
        - type: object
          required: [messages, runs]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            runs:
              type: array
              items:
                $ref: "#/components/schemas/Run"
    Message:
      type: object
      required: [id, role, authorUserId, runId, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        authorUserId:
          type: string
          nullable: true
        runId:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    RunStatus:
      type: string
      enum: [queued, running, succeeded, incomplete, failed, cancelled]
    RunStage:
      type: string
      nullable: true
      enum: [prepare, checkout, setup, agent, verify, deliver]
    ChangedFile:
      type: object
      required: [path, added, removed]
      properties:
        path:
          type: string
        added:
          type: integer
          nullable: true
          description: null for binary files
        removed:
          type: integer
          nullable: true
    Run:
      type: object
      required: [id, taskId, trigger, status, stage, model, summary, checksPassed, commitSha, error, steps, inputTokens, outputTokens, costUsd, queuedAt, startedAt, finishedAt, durationMs, changes]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [initial, follow_up, pr_comment, retry]
        status:
          $ref: "#/components/schemas/RunStatus"
        stage:
          $ref: "#/components/schemas/RunStage"
        model:
          type: string
        summary:
          type: string
          nullable: true
        checksPassed:
          type: boolean
          nullable: true
        commitSha:
          type: string
          nullable: true
        error:
          $ref: "#/components/schemas/RunError"
        steps:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        costUsd:
          type: number
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          nullable: true
        changes:
          type: object
          nullable: true
          required: [files, truncated]
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/ChangedFile"
            truncated:
              type: boolean
    RunDiff:
      type: object
      required: [patch, files, truncated]
      properties:
        patch:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChangedFile"
        truncated:
          type: boolean

security:
  - sessionCookie: []
