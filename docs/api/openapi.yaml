openapi: 3.0.3
info:
  title: CodeGenie API
  version: 1.0.0
  description: HTTP API for the CodeGenie web app.
servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Health
  - name: GitHub
  - name: Projects
  - name: Onboarding
  - name: Tasks
  - name: Runs

paths:
  /health:
    get:
      tags: [Health]
      summary: Process health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessHealth"

  /api/github/installations:
    get:
      tags: [GitHub]
      summary: GitHub App installations the signed-in user can access
      description: Through the user's own GitHub token. `installUrl` installs the App or changes which repositories it can access.
      operationId: listGitHubInstallations
      responses:
        "200":
          description: Installations and the install link
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [installations, installUrl]
                        properties:
                          installations:
                            type: array
                            items:
                              $ref: "#/components/schemas/GitHubInstallation"
                          installUrl:
                            type: string
                            format: uri
                            example: https://github.com/apps/codegenie-dev-app/installations/new
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"

  /api/github/installations/{installationId}/repositories:
    get:
      tags: [GitHub]
      summary: Repositories of one installation that the signed-in user can access
      description: Most recently updated first.
      operationId: listGitHubInstallationRepositories
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [repositories]
                        properties:
                          repositories:
                            type: array
                            items:
                              $ref: "#/components/schemas/GitHubRepo"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"
        "404":
          description: The user can't access this installation (`GITHUB_INSTALLATION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/github/webhooks:
    post:
      tags: [GitHub]
      summary: GitHub App webhook receiver
      description: Called by GitHub, not the web app. The body is checked against `X-Hub-Signature-256` with the webhook secret. Each delivery is processed once (`X-GitHub-Delivery`); a failed one is forgotten so GitHub's redelivery is processed. Answers are plain JSON, not the envelope. See github.md §6.
      operationId: receiveGitHubWebhook
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
            example: pull_request
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's event payload
      responses:
        "200":
          description: Processed, or a duplicate delivery skipped
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [ok]
                    properties:
                      ok:
                        type: boolean
                        enum: [true]
                  - type: object
                    required: [duplicate]
                    properties:
                      duplicate:
                        type: boolean
                        enum: [true]
        "400":
          description: Missing `X-GitHub-Event` or `X-GitHub-Delivery`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMessage"
        "401":
          description: Missing or invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMessage"
        "500":
          description: Processing failed; GitHub may redeliver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMessage"

  /api/github/installations/callback:
    get:
      tags: [GitHub]
      summary: Where GitHub returns after installing the App
      description: >-
        GitHub redirects the browser here. With a session, the installation is checked against the user's own GitHub
        installations and recorded, then the browser goes back to the website: `/projects/new` when `state` is
        `add-repo`, else `/welcome`, with `?github=installed`, `not-found`, `requested` (an org owner must approve) or
        `cancelled`. Without a session or a GitHub token it goes to `/signin?next=<that page>`. See github.md §6.
      operationId: gitHubInstallationCallback
      security: []
      parameters:
        - name: installation_id
          in: query
          required: false
          schema:
            type: integer
        - name: setup_action
          in: query
          required: false
          schema:
            type: string
            example: install
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [add-repo]
      responses:
        "302":
          description: Redirect to the website
          headers:
            Location:
              schema:
                type: string
                format: uri
                example: http://localhost:3000/welcome?github=installed

  /api/projects:
    get:
      tags: [Projects]
      summary: The signed-in user's projects
      description: Newest first.
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [projects]
                        properties:
                          projects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Add a repository as a project
      description: The installation must be recorded, installed and not suspended, and the repository visible through the user's own GitHub token. Adding a repository that's already a project returns that project.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "200":
          description: Already a project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"
        "404":
          description: The installation isn't recorded, was uninstalled or isn't visible to the user (`GITHUB_INSTALLATION_NOT_FOUND`), or the repository isn't visible (`GITHUB_REPOSITORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The App is suspended on that account (`GITHUB_INSTALLATION_SUSPENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      summary: One of the signed-in user's projects
      operationId: getProject
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
    delete:
      tags: [Projects]
      summary: Remove a project
      description: Deletes its tasks, runs and environments from CodeGenie. The repository and its pull requests on GitHub are not touched.
      operationId: deleteProject
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: string
                            format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: A run is queued or running (`PROJECT_BUSY`); cancel it first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}/onboarding:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Onboarding]
      summary: Set up the project's environment
      description: Records a setup and queues it. While one is queued, running or waiting for an answer, that one is returned instead.
      operationId: startOnboarding
      responses:
        "202":
          description: The new setup, or the one in progress
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [onboarding]
                        properties:
                          onboarding:
                            $ref: "#/components/schemas/Onboarding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: The App is uninstalled (`GITHUB_INSTALLATION_REMOVED`) or suspended (`GITHUB_INSTALLATION_SUSPENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
    get:
      tags: [Onboarding]
      summary: The project's latest setup
      description: With the open question while it waits for an answer; `null` before the first setup.
      operationId: getLatestOnboarding
      responses:
        "200":
          description: The latest setup, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [onboarding]
                        properties:
                          onboarding:
                            allOf:
                              - $ref: "#/components/schemas/Onboarding"
                            nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"

  /api/projects/{projectId}/onboarding/events:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Onboarding]
      summary: The latest setup's events, replayed then live (server-sent events)
      description: |
        Same frames as a run's stream, with `data: <OnboardingEvent JSON>` (`info`, `question_asked`, `question_answered`, the runner's events, and `done`).
        Follows the project's latest setup at the moment of connecting; stays open while it waits for an answer; ends after `done` or once the setup has ended. See docs/knowledge/api.md §6.
      operationId: streamOnboardingEvents
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume after this event (EventSource sends it on reconnect)
          schema:
            type: integer
            minimum: 0
        - name: after
          in: query
          description: Same as Last-Event-ID, for clients that can't set headers
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                data: {"type":"info","message":"Found a pnpm workspace with 2 projects","onboardingId":"…","seq":1,"ts":"…"}

                id: 2
                data: {"type":"question_asked","questionId":"…","question":"Backend tests need PostgreSQL. What should I do?","options":[{"label":"Skip them"},{"label":"Keep them"}],"allowOther":true,"onboardingId":"…","seq":2,"ts":"…"}

                : ping
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/OnboardingNotFound"

  /api/projects/{projectId}/onboarding/answer:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Onboarding]
      summary: Answer the setup's open question
      description: Checked against the open question, then handed to the worker, which records it and carries on.
      operationId: answerOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerOnboarding"
      responses:
        "202":
          description: Handed to the worker
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [questionId]
                        properties:
                          questionId:
                            type: string
        "400":
          description: Not one of the options, or free text where the question doesn't allow it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/OnboardingNotFound"
        "409":
          description: That question isn't waiting for an answer any more (`QUESTION_NOT_OPEN`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}/onboarding/cancel:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Onboarding]
      summary: Stop setup
      description: A queued setup is cancelled at once; a running or waiting one is told to stop and ends cancelled shortly after.
      operationId: cancelOnboarding
      responses:
        "202":
          description: Cancelled, or stopping
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [outcome]
                        properties:
                          outcome:
                            type: string
                            enum: [cancelled, stopping]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/OnboardingNotFound"
        "409":
          description: The setup has already ended (`ONBOARDING_ENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}/environments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      summary: The project's environment versions
      description: Saved versions, newest first; `active` marks the one new tasks use.
      operationId: listEnvironments
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [environments]
                        properties:
                          environments:
                            type: array
                            items:
                              $ref: "#/components/schemas/Environment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"

  /api/projects/{projectId}/environments/{version}/restore:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Projects]
      summary: Make an older environment version active again
      description: New tasks use it from then on, with the health it had. The version that was active is kept; the next setup saves the next number.
      operationId: restoreEnvironment
      responses:
        "200":
          description: The restored version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [environment]
                        properties:
                          environment:
                            $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The project (`PROJECT_NOT_FOUND`) or the version (`ENVIRONMENT_NOT_FOUND`) doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: A setup is queued, running or waiting for an answer (`SETUP_IN_PROGRESS`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}/branches:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      summary: The repository's branches
      description: Branch names from GitHub, read with the user's GitHub token, the project's default branch first. At most 1,000; `truncated` says when there are more.
      operationId: listBranches
      responses:
        "200":
          description: The branches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [branches, defaultBranch, truncated]
                        properties:
                          branches:
                            type: array
                            items:
                              type: string
                          defaultBranch:
                            type: string
                          truncated:
                            type: boolean
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"
        "404":
          description: Not one of the user's projects (`PROJECT_NOT_FOUND`), or GitHub no longer shows the user the repository (`GITHUB_REPOSITORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}/tasks:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Start a task on a project
      description: Creates the task, its first message and a queued run, and queues the run. The title is the prompt's first line; the base branch defaults to the project's.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Created and queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [task, run]
                        properties:
                          task:
                            type: object
                            required: [id, projectId, title, baseBranch, createdAt]
                            properties:
                              id:
                                type: string
                                format: uuid
                              projectId:
                                type: string
                                format: uuid
                              title:
                                type: string
                              baseBranch:
                                type: string
                              createdAt:
                                type: string
                                format: date-time
                          run:
                            type: object
                            required: [id, status, model]
                            properties:
                              id:
                                type: string
                                format: uuid
                              status:
                                type: string
                                enum: [queued]
                              model:
                                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: The project isn't set up (`PROJECT_NOT_SET_UP`), needs attention (`PROJECT_NEEDS_ATTENTION`), or its App is uninstalled (`GITHUB_INSTALLATION_REMOVED`) or suspended (`GITHUB_INSTALLATION_SUSPENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/QueueUnavailable"

  /api/tasks:
    get:
      tags: [Tasks]
      summary: The signed-in user's tasks
      description: Newest first, 50 per page, with how many tasks each filter holds.
      operationId: listTasks
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          description: "running: the latest run is queued or running. pr: otherwise, a pull request is open (or draft). done: everything else."
          schema:
            type: string
            enum: [running, pr, done]
        - name: cursor
          in: query
          description: "`nextCursor` from the previous page"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [tasks, nextCursor, counts]
                        properties:
                          tasks:
                            type: array
                            items:
                              $ref: "#/components/schemas/TaskListItem"
                          nextCursor:
                            type: string
                            format: uuid
                            nullable: true
                          counts:
                            description: Across all pages (one project's, with projectId), whatever the filter
                            type: object
                            required: [all, running, pr, done]
                            properties:
                              all:
                                type: integer
                              running:
                                type: integer
                              pr:
                                type: integer
                              done:
                                type: integer
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: A task with its messages and runs
      operationId: getTask
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [task]
                        properties:
                          task:
                            $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not one of the user's tasks (`TASK_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Runs]
      summary: One run
      operationId: getRun
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [run]
                        properties:
                          run:
                            $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"

  /api/runs/{runId}/diff:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Runs]
      summary: The run's changes as a patch
      operationId: getRunDiff
      responses:
        "200":
          description: The diff, or null when the run changed nothing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [diff]
                        properties:
                          diff:
                            nullable: true
                            allOf:
                              - $ref: "#/components/schemas/RunDiff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"

  /api/runs/{runId}/events:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Runs]
      summary: The run's events, replayed then live (server-sent events)
      description: |
        Keeps the response open and writes one frame per event: `id: <seq>` (stored events only) and `data: <RunEvent JSON>`, separated by a blank line; `: ping` comments every 15 s.
        Replays stored events after `Last-Event-ID` / `after`, then forwards live ones; ends after the `done` event or once the run has ended. See docs/knowledge/api.md §6.
      operationId: streamRunEvents
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume after this event (EventSource sends it on reconnect)
          schema:
            type: integer
            minimum: 0
        - name: after
          in: query
          description: Same as Last-Event-ID, for clients that can't set headers
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 1
                data: {"type":"stage_changed","stage":"prepare","runId":"…","seq":1,"ts":"…"}

                : ping

                id: 2
                data: {"type":"done","status":"succeeded","runId":"…","seq":2,"ts":"…"}
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"

  /api/runs/{runId}/cancel:
    parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Runs]
      summary: Cancel a run
      description: A queued run is cancelled at once; a running one is told to stop and ends cancelled shortly after.
      operationId: cancelRun
      responses:
        "202":
          description: Cancelled, or stopping
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [outcome]
                        properties:
                          outcome:
                            type: string
                            enum: [cancelled, stopping]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "409":
          description: The run has already ended (`RUN_ENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie set by signing in.

  responses:
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubSignInRequired:
      description: Not signed in, or no usable GitHub token (`GITHUB_SIGN_IN_REQUIRED`); sign in with GitHub again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProjectNotFound:
      description: Not one of the user's projects, or it doesn't exist (`PROJECT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RunNotFound:
      description: Not a run on one of the user's tasks (`RUN_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OnboardingNotFound:
      description: The project was never set up (`ONBOARDING_NOT_FOUND`), or it isn't one of the user's projects (`PROJECT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    QueueUnavailable:
      description: Work couldn't be queued (`QUEUE_UNAVAILABLE`); try again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    WebhookMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Invalid signature

    SuccessEnvelope:
      type: object
      required: [status, message, type, data]
      properties:
        status:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [success]
        data:
          type: object

    ErrorEnvelope:
      type: object
      required: [status, message, type]
      properties:
        status:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [error]
        code:
          type: string
        data:
          type: object

    ProcessHealth:
      type: object
      required: [status, timestamp, environment]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        environment:
          type: string
          example: development

    GitHubInstallation:
      type: object
      required: [id, accountLogin, accountType]
      properties:
        id:
          type: integer
          example: 173633971
        accountLogin:
          type: string
          example: acme
        accountType:
          type: string
          enum: [user, organization]
    GitHubRepo:
      type: object
      required: [id, fullName, owner, name, defaultBranch, private, htmlUrl, updatedAt, language, projectId]
      properties:
        id:
          type: integer
          description: GitHub's repository id
        fullName:
          type: string
          example: octocat/Hello-World
        owner:
          type: string
        name:
          type: string
        defaultBranch:
          type: string
          example: main
        private:
          type: boolean
        htmlUrl:
          type: string
          format: uri
        updatedAt:
          type: string
          format: date-time
          nullable: true
        language:
          type: string
          nullable: true
          description: GitHub's main language; null for forks and repositories it hasn't analysed
          example: TypeScript
        projectId:
          type: string
          format: uuid
          nullable: true
          description: The user's project for this repository, if it's one already
    Onboarding:
      type: object
      required: [id, status, question, environmentVersion, error, inputTokens, outputTokens, costUsd, queuedAt, startedAt, finishedAt, durationMs]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, waiting, succeeded, failed, cancelled]
          description: "`waiting`: a question is open"
        question:
          allOf:
            - $ref: "#/components/schemas/OnboardingQuestion"
          nullable: true
        environmentVersion:
          type: integer
          nullable: true
          description: The version it saved
        error:
          type: object
          nullable: true
          required: [code, message]
          properties:
            code:
              type: string
              example: NO_ANSWER
            message:
              type: string
              nullable: true
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        costUsd:
          type: number
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          nullable: true
    OnboardingQuestion:
      type: object
      required: [id, question, options, allowOther]
      properties:
        id:
          type: string
        question:
          type: string
          example: Backend tests need PostgreSQL. What should I do?
        why:
          type: string
        options:
          type: array
          description: 2–4; the first is recommended
          items:
            type: object
            required: [label]
            properties:
              label:
                type: string
              detail:
                type: string
        allowOther:
          type: boolean
          description: Whether an answer in your own words is accepted
    AnswerOnboarding:
      type: object
      required: [questionId, answer]
      properties:
        questionId:
          type: string
        answer:
          oneOf:
            - type: object
              required: [option]
              properties:
                option:
                  type: integer
                  minimum: 0
            - type: object
              required: [other]
              properties:
                other:
                  type: string
                  minLength: 1
                  maxLength: 2000
    Environment:
      type: object
      required: [version, active, source, savedAt, health, healthReasons, steps, checks, decisions]
      properties:
        version:
          type: integer
        active:
          type: boolean
          description: The version new tasks use
        source:
          type: string
          enum: [detected, ai, user, mixed]
        savedAt:
          type: string
          format: date-time
        health:
          type: string
          enum: [ok, needs_attention]
        healthReasons:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: object
            required: [name, cwd, command]
            properties:
              name:
                type: string
              cwd:
                type: string
              command:
                type: string
        checks:
          type: array
          items:
            type: object
            required: [name, cwd, command]
            properties:
              name:
                type: string
              cwd:
                type: string
              command:
                type: string
        decisions:
          type: array
          items:
            type: object
            required: [question, answer, auto]
            properties:
              question:
                type: string
              answer:
                type: string
              auto:
                type: boolean
    Project:
      type: object
      required: [id, repo, defaultBranch, environment, installation, setup, createdAt]
      properties:
        id:
          type: string
          format: uuid
        repo:
          type: object
          required: [githubId, owner, name]
          properties:
            githubId:
              type: integer
            owner:
              type: string
              example: acme
            name:
              type: string
              example: web
        defaultBranch:
          type: string
          example: main
        environment:
          type: object
          nullable: true
          description: The active environment; null until the project is set up
          required: [version, health, healthReasons, savedAt]
          properties:
            version:
              type: integer
            health:
              type: string
              enum: [ok, needs_attention]
            healthReasons:
              type: array
              items:
                type: string
            savedAt:
              type: string
              format: date-time
        installation:
          type: object
          required: [id, accountLogin, accountType, suspended, uninstalled]
          properties:
            id:
              type: integer
              description: GitHub's id for the installation
              example: 173633971
            accountLogin:
              type: string
            accountType:
              type: string
              enum: [user, organization]
            suspended:
              type: boolean
            uninstalled:
              type: boolean
        setup:
          type: object
          nullable: true
          description: The latest setup; null before the first
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, running, waiting, succeeded, failed, cancelled]
        createdAt:
          type: string
          format: date-time
    CreateProject:
      type: object
      required: [installationId, repoId]
      properties:
        installationId:
          type: integer
          description: GitHub's installation id
        repoId:
          type: integer
          description: GitHub's repository id

    CreateTask:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
          example: Add a GET /health endpoint that returns 503 when the database is down.
        baseBranch:
          type: string
          example: main
    TaskLabel:
      type: string
      enum: [queued, working, pr_open, pr_draft, merged, closed, no_changes, failed, cancelled]
    RunError:
      type: object
      nullable: true
      required: [code, message]
      properties:
        code:
          type: string
          example: deliver_failed
        message:
          type: string
          nullable: true
    TaskListItem:
      type: object
      required: [id, title, project, label, baseBranch, branchName, pullRequest, latestRun, runCount, durationMs, costUsd, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        project:
          type: object
          required: [id, owner, name]
          properties:
            id:
              type: string
              format: uuid
            owner:
              type: string
            name:
              type: string
        label:
          $ref: "#/components/schemas/TaskLabel"
        baseBranch:
          type: string
        branchName:
          type: string
          nullable: true
        pullRequest:
          type: object
          nullable: true
          required: [number, url, draft]
          properties:
            number:
              type: integer
            url:
              type: string
              format: uri
            draft:
              type: boolean
        latestRun:
          type: object
          nullable: true
          required: [id, status, stage, error, checksPassed, filesChanged, summaryLine]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/RunStatus"
            stage:
              $ref: "#/components/schemas/RunStage"
            error:
              $ref: "#/components/schemas/RunError"
            checksPassed:
              type: boolean
              nullable: true
            filesChanged:
              type: integer
              nullable: true
              description: Files in the run's diff; null without one
            summaryLine:
              type: string
              nullable: true
              description: The summary's first line that isn't a heading, at most 200 characters
        runCount:
          type: integer
        durationMs:
          type: integer
        costUsd:
          type: number
          example: 0.21
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskListItem"
        - type: object
          required: [messages, runs]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            runs:
              type: array
              items:
                $ref: "#/components/schemas/Run"
    Message:
      type: object
      required: [id, role, authorUserId, runId, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        authorUserId:
          type: string
          nullable: true
        runId:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    RunStatus:
      type: string
      enum: [queued, running, succeeded, incomplete, failed, cancelled]
    RunStage:
      type: string
      nullable: true
      enum: [prepare, checkout, setup, agent, verify, deliver]
    ChangedFile:
      type: object
      required: [path, added, removed]
      properties:
        path:
          type: string
        added:
          type: integer
          nullable: true
          description: null for binary files
        removed:
          type: integer
          nullable: true
    Run:
      type: object
      required: [id, taskId, trigger, status, stage, model, summary, checksPassed, commitSha, error, steps, inputTokens, outputTokens, costUsd, queuedAt, startedAt, finishedAt, durationMs, changes]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [initial, follow_up, pr_comment, retry]
        status:
          $ref: "#/components/schemas/RunStatus"
        stage:
          $ref: "#/components/schemas/RunStage"
        model:
          type: string
        summary:
          type: string
          nullable: true
        checksPassed:
          type: boolean
          nullable: true
        commitSha:
          type: string
          nullable: true
        error:
          $ref: "#/components/schemas/RunError"
        steps:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        costUsd:
          type: number
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          nullable: true
        changes:
          type: object
          nullable: true
          required: [files, truncated]
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/ChangedFile"
            truncated:
              type: boolean
    RunDiff:
      type: object
      required: [patch, files, truncated]
      properties:
        patch:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/ChangedFile"
        truncated:
          type: boolean

security:
  - sessionCookie: []
