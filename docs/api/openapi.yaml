openapi: 3.0.3
info:
  title: CodeGenie API
  version: 1.0.0
  description: HTTP API for the CodeGenie web app.
servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Health
  - name: Example
  - name: GitHub
  - name: Projects

paths:
  /health:
    get:
      tags: [Health]
      summary: Process health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessHealth"

  /api/example/health:
    get:
      tags: [Example]
      summary: Example resource health check
      operationId: getExampleHealth
      security: []
      responses:
        "200":
          description: Example resource is up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [health]
                        properties:
                          health:
                            $ref: "#/components/schemas/ExampleHealth"

  /api/example/items:
    get:
      tags: [Example]
      summary: List example items for the signed-in user
      operationId: listExampleItems
      responses:
        "200":
          description: Items for the current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ExampleItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Example]
      summary: Create an example item
      operationId: createExampleItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExampleItem"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: "#/components/schemas/ExampleItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/example/items/{itemId}:
    get:
      tags: [Example]
      summary: Get one example item
      operationId: getExampleItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [item]
                        properties:
                          item:
                            $ref: "#/components/schemas/ExampleItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/github/installations:
    get:
      tags: [GitHub]
      summary: GitHub App installations the signed-in user can access
      description: Through the user's own GitHub token. `installUrl` installs the App or changes which repositories it can access.
      operationId: listGitHubInstallations
      responses:
        "200":
          description: Installations and the install link
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [installations, installUrl]
                        properties:
                          installations:
                            type: array
                            items:
                              $ref: "#/components/schemas/GitHubInstallation"
                          installUrl:
                            type: string
                            format: uri
                            example: https://github.com/apps/codegenie-dev-app/installations/new
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"

  /api/github/installations/{installationId}/repositories:
    get:
      tags: [GitHub]
      summary: Repositories of one installation that the signed-in user can access
      description: Most recently updated first.
      operationId: listGitHubInstallationRepositories
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [repositories]
                        properties:
                          repositories:
                            type: array
                            items:
                              $ref: "#/components/schemas/GitHubRepo"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"
        "404":
          description: The user can't access this installation (`GITHUB_INSTALLATION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects:
    get:
      tags: [Projects]
      summary: The signed-in user's projects
      description: Newest first.
      operationId: listProjects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [projects]
                        properties:
                          projects:
                            type: array
                            items:
                              $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      summary: Add a repository as a project
      description: The installation must be recorded, installed and not suspended, and the repository visible through the user's own GitHub token. Adding a repository that's already a project returns that project.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "200":
          description: Already a project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/GitHubSignInRequired"
        "404":
          description: The installation isn't recorded, was uninstalled or isn't visible to the user (`GITHUB_INSTALLATION_NOT_FOUND`), or the repository isn't visible (`GITHUB_REPOSITORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The App is suspended on that account (`GITHUB_INSTALLATION_SUSPENDED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      summary: One of the signed-in user's projects
      operationId: getProject
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [project]
                        properties:
                          project:
                            $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
    delete:
      tags: [Projects]
      summary: Remove a project
      description: Deletes its tasks, runs and environments from CodeGenie. The repository and its pull requests on GitHub are not touched.
      operationId: deleteProject
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id:
                            type: string
                            format: uuid
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: A run is queued or running (`PROJECT_BUSY`); cancel it first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie set by signing in.

  responses:
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GitHubSignInRequired:
      description: Not signed in, or no usable GitHub token (`GITHUB_SIGN_IN_REQUIRED`); sign in with GitHub again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProjectNotFound:
      description: Not one of the user's projects, or it doesn't exist (`PROJECT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    SuccessEnvelope:
      type: object
      required: [status, message, type, data]
      properties:
        status:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [success]
        data:
          type: object

    ErrorEnvelope:
      type: object
      required: [status, message, type]
      properties:
        status:
          type: integer
        message:
          type: string
        type:
          type: string
          enum: [error]
        code:
          type: string
        data:
          type: object

    ProcessHealth:
      type: object
      required: [status, timestamp, environment]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        environment:
          type: string
          example: development

    ExampleHealth:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [up]
        timestamp:
          type: string
          format: date-time

    ExampleItem:
      type: object
      required: [id, userId, name, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateExampleItem:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    GitHubInstallation:
      type: object
      required: [id, accountLogin, accountType]
      properties:
        id:
          type: integer
          example: 173633971
        accountLogin:
          type: string
          example: acme
        accountType:
          type: string
          enum: [user, organization]
    GitHubRepo:
      type: object
      required: [id, fullName, owner, name, defaultBranch, private, htmlUrl, updatedAt, projectId]
      properties:
        id:
          type: integer
          description: GitHub's repository id
        fullName:
          type: string
          example: octocat/Hello-World
        owner:
          type: string
        name:
          type: string
        defaultBranch:
          type: string
          example: main
        private:
          type: boolean
        htmlUrl:
          type: string
          format: uri
        updatedAt:
          type: string
          format: date-time
          nullable: true
        projectId:
          type: string
          format: uuid
          nullable: true
          description: The user's project for this repository, if it's one already
    Project:
      type: object
      required: [id, repo, defaultBranch, environment, installation, createdAt]
      properties:
        id:
          type: string
          format: uuid
        repo:
          type: object
          required: [githubId, owner, name]
          properties:
            githubId:
              type: integer
            owner:
              type: string
              example: acme
            name:
              type: string
              example: web
        defaultBranch:
          type: string
          example: main
        environment:
          type: object
          nullable: true
          description: The active environment; null until the project is set up
          required: [version, health, healthReasons, savedAt]
          properties:
            version:
              type: integer
            health:
              type: string
              enum: [ok, needs_attention]
            healthReasons:
              type: array
              items:
                type: string
            savedAt:
              type: string
              format: date-time
        installation:
          type: object
          required: [accountLogin, suspended, uninstalled]
          properties:
            accountLogin:
              type: string
            suspended:
              type: boolean
            uninstalled:
              type: boolean
        createdAt:
          type: string
          format: date-time
    CreateProject:
      type: object
      required: [installationId, repoId]
      properties:
        installationId:
          type: integer
          description: GitHub's installation id
        repoId:
          type: integer
          description: GitHub's repository id

security:
  - sessionCookie: []
