<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="Geist, system-ui, sans-serif" role="img" aria-label="Your repository goes into a sandbox, through checks, and out as a pull request"><rect width="1200" height="260" fill="#fafafa"/><rect x="20" y="60" width="248" height="140" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="42" y="120" font-size="27" font-weight="600" fill="#0f0f12">Your repository</text><text x="42" y="158" font-size="20" fill="#6b6c74">the ones you choose</text><path d="M280 130h32m-10-10 10 10-10 10" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="324" y="60" width="248" height="140" rx="14" fill="#ffffff" stroke="#6b6c74" stroke-width="2"/><text x="346" y="120" font-size="27" font-weight="600" fill="#0f0f12">Sandbox</text><text x="346" y="158" font-size="20" fill="#6b6c74">fresh for every run</text><path d="M584 130h32m-10-10 10 10-10 10" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="628" y="60" width="248" height="140" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="650" y="120" font-size="27" font-weight="600" fill="#0f0f12">Checks</text><text x="650" y="158" font-size="20" fill="#6b6c74">before and after</text><path d="M888 130h32m-10-10 10 10-10 10" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="932" y="60" width="248" height="140" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="954" y="120" font-size="27" font-weight="600" fill="#0f0f12">Pull request</text><text x="954" y="158" font-size="20" fill="#6b6c74">on its own branch</text></svg>
