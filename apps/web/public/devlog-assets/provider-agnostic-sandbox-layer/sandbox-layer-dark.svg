<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Geist, system-ui, sans-serif" role="img" aria-label="The agent's tools call one Sandbox interface with five methods. Behind it, three providers: Docker for local development, Daytona, and E2B in production. Each provider turns its service's behaviour into the same results and errors."><rect width="1200" height="540" fill="#0f0f11"/><line x1="616" y1="56" x2="616" y2="520" stroke="#26262b" stroke-width="2" stroke-dasharray="8 6"/><text x="604" y="40" text-anchor="end" font-size="19" fill="#8e8e97">provider-agnostic</text><text x="628" y="40" font-size="19" fill="#8e8e97">provider-specific</text><rect x="20" y="190" width="220" height="200" rx="14" fill="#131316" stroke="#26262b" stroke-width="2"/><text x="130" y="236" text-anchor="middle" font-size="26" font-weight="600" fill="#ededef">Agent tools</text><text x="130" y="276" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#8e8e97">read_file</text><text x="130" y="304" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#8e8e97">edit_file</text><text x="130" y="332" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#8e8e97">bash</text><text x="130" y="360" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#8e8e97">run_checks</text><path d="M246 290h38m-8-8 8 8-8 8" fill="none" stroke="#8e8e97" stroke-width="2.5"/><rect x="290" y="130" width="270" height="320" rx="14" fill="#131316" stroke="#8e8e97" stroke-width="2"/><text x="425" y="176" text-anchor="middle" font-size="26" font-weight="600" fill="#ededef">Sandbox</text><text x="425" y="220" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#ededef">exec()</text><text x="425" y="254" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#ededef">readFile()</text><text x="425" y="288" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#ededef">writeFile()</text><text x="425" y="322" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#ededef">listFiles()</text><text x="425" y="356" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#ededef">destroy()</text><text x="425" y="420" text-anchor="middle" font-size="18" fill="#8e8e97">+ four error types</text><path d="M566 290h28" fill="none" stroke="#8e8e97" stroke-width="2.5"/><path d="M594 135V445" fill="none" stroke="#8e8e97" stroke-width="2.5"/><path d="M594 135h40m-8-8 8 8-8 8" fill="none" stroke="#8e8e97" stroke-width="2.5"/><path d="M594 290h40m-8-8 8 8-8 8" fill="none" stroke="#8e8e97" stroke-width="2.5"/><path d="M594 445h40m-8-8 8 8-8 8" fill="none" stroke="#8e8e97" stroke-width="2.5"/><rect x="640" y="70" width="540" height="130" rx="14" fill="#131316" stroke="#26262b" stroke-width="2"/><text x="664" y="114" font-family="Geist Mono, ui-monospace, monospace" font-size="24" font-weight="600" fill="#ededef">DockerSandbox</text><text x="664" y="150" font-size="19" fill="#8e8e97">local development, a container</text><text x="664" y="178" font-size="19" fill="#8e8e97">runs commands under timeout in docker exec</text><rect x="640" y="225" width="540" height="130" rx="14" fill="#131316" stroke="#26262b" stroke-width="2"/><text x="664" y="269" font-family="Geist Mono, ui-monospace, monospace" font-size="24" font-weight="600" fill="#ededef">DaytonaSandbox</text><text x="664" y="305" font-size="19" fill="#8e8e97">still available, a cloud container</text><text x="664" y="333" font-size="19" fill="#8e8e97">splits mixed stdout and stderr with a marker</text><rect x="640" y="380" width="540" height="130" rx="14" fill="#131316" stroke="#26262b" stroke-width="2"/><text x="664" y="424" font-family="Geist Mono, ui-monospace, monospace" font-size="24" font-weight="600" fill="#ededef">E2BSandbox</text><text x="664" y="460" font-size="19" fill="#8e8e97">production, a Firecracker microVM</text><text x="664" y="488" font-size="19" fill="#8e8e97">turns a thrown non-zero exit back into a result</text></svg>