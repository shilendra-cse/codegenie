<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Geist, system-ui, sans-serif" role="img" aria-label="The browser talks to the web app, which proxies to the API server. The API server enqueues work for the worker. The worker runs the agent loop and calls the sandbox, the model and GitHub. The API server and the worker share Postgres."><rect width="1200" height="500" fill="#fafafa"/><rect x="20" y="205" width="170" height="110" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="105.0" y="269.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">Browser</text><path d="M196 260h18m-8-8 8 8-8 8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="220" y="205" width="170" height="110" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="305.0" y="269.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">Web app</text><path d="M396 260h18m-8-8 8 8-8 8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="420" y="205" width="170" height="110" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="505.0" y="269.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">API server</text><path d="M596 260h18m-8-8 8 8-8 8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="620" y="205" width="170" height="110" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="705.0" y="269.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">Queue</text><path d="M796 260h18m-8-8 8 8-8 8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="820" y="205" width="170" height="110" rx="14" fill="#ffffff" stroke="#6b6c74" stroke-width="2"/><text x="905.0" y="269.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">Worker</text><rect x="1030" y="50" width="150" height="100" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2" stroke-dasharray="8 6"/><text x="1105.0" y="109.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">Sandbox</text><rect x="1030" y="210" width="150" height="100" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="1105.0" y="269.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">Model</text><rect x="1030" y="370" width="150" height="100" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="1105.0" y="429.0" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">GitHub</text><path d="M996 260h28m-8-8 8 8-8 8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><path d="M996 260h14V100h14m-8-8 8 8-8 8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><path d="M1010 260V420h14m-8-8 8 8-8 8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><rect x="420" y="390" width="570" height="90" rx="14" fill="#ffffff" stroke="#e6e6ea" stroke-width="2"/><text x="705" y="428" text-anchor="middle" font-size="26" font-weight="600" fill="#0f0f12">Postgres</text><text x="705" y="460" text-anchor="middle" font-size="19" fill="#6b6c74">shared by the API server and the worker</text><path d="M505 321v63m-8-8 8 8 8-8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><path d="M905 321v63m-8-8 8 8 8-8" fill="none" stroke="#6b6c74" stroke-width="2.5"/><text x="1180" y="34" font-size="19" text-anchor="end" fill="#6b6c74">untrusted code runs only here</text></svg>