<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run lifecycle</title>
<style>
:root{--bg:#fafafa;--card:#fff;--border:#e6e6ea;--text:#0f0f12;--muted:#55565e;--accent:#0f0f12;--on-accent:#fff}
:root[data-theme="dark"]{--bg:#0f0f11;--card:#131316;--border:#26262b;--text:#ededef;--muted:#a3a3ab;--accent:#ededef;--on-accent:#0a0a0b}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
button{min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--muted);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{padding:24px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
h2{margin:0 0 8px;font-size:20px}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<div class="steps" role="group" aria-label="Run stages"></div>
<div class="card"><h2 id="name"></h2><p id="text"></p></div>
<script>
const theme = new URLSearchParams(location.search).get("theme");
document.documentElement.dataset.theme =
  theme === "light" || theme === "dark"
    ? theme
    : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
const stages = [
  ["Sandbox", "A fresh, isolated sandbox starts for this run."],
  ["Install", "Your repository is cloned and installed with the steps saved at setup."],
  ["Checks before", "Lint, type-check and tests run on the untouched code."],
  ["Change", "The agent reads files, edits them and runs commands."],
  ["Checks after", "The same checks run again on the changed code."],
  ["Pull request", "A pull request with a summary and both check results."],
];
const group = document.querySelector(".steps");
function show(index) {
  group.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === index)));
  document.getElementById("name").textContent = stages[index][0];
  document.getElementById("text").textContent = stages[index][1];
}
stages.forEach(([name], i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = name;
  b.onclick = () => show(i);
  group.append(b);
});
show(0);
</script>
</body>
</html>
