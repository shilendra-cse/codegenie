services:
  postgres:
    image: postgres:15-alpine
    container_name: hobai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hobai_db
      POSTGRES_USER: hobai_user
      POSTGRES_PASSWORD: hobai_password
    ports:
      - "5439:5432" # Match the port in your .env file
    volumes:
      - hobai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hobai_user -d hobai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  
  redis:
    image: redis:7-alpine
    container_name: hobai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - hobai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  hobai_postgres_data:
    driver: local

  hobai_redis_data:
    driver: local