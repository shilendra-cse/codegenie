name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine # same as apps/server/docker-compose.yml
        env:
          POSTGRES_USER: codegenie
          POSTGRES_PASSWORD: codegenie
          POSTGRES_DB: codegenie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codegenie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine # same as apps/server/docker-compose.yml
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build sandbox image
        run: pnpm sandbox:build-image

      - name: Test
        run: pnpm test
        env:
          # Database tests each create (and drop) their own database on this server.
          TEST_DATABASE_URL: postgresql://codegenie:codegenie@localhost:5432/codegenie
          TEST_REDIS_URL: redis://localhost:6379
