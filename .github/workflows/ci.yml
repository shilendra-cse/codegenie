name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine # same as apps/server/docker-compose.yml
        env:
          POSTGRES_USER: hobai
          POSTGRES_PASSWORD: hobai
          POSTGRES_DB: hobai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hobai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine # same as apps/server/docker-compose.yml
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      # Same image as `pnpm sandbox:build-image`, with layers cached between runs.
      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: packages/sandbox/images/base
          tags: hobai-base
          load: true
          cache-from: type=gha,scope=sandbox-base
          cache-to: type=gha,mode=max,scope=sandbox-base

      - name: Test
        run: pnpm test
        env:
          # Database tests each create (and drop) their own database on this server.
          TEST_DATABASE_URL: postgresql://hobai:hobai@localhost:5432/hobai
          TEST_REDIS_URL: redis://localhost:6379
